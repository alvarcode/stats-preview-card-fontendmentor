<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="card">
        <div class="main-container description">
          <h1 class="title">
            Get <span>insights</span> that help your business grow.
          </h1>

          <p class="paragraph">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>

          <section class="container">
            <div class="item"><span class="title">10k+</span>COMPANIES</div>
            <div class="item"><span class="title">314</span> TEMPLATES</div>
            <div class="item"><span class="title">12M+</span> QUERIES</div>
          </section>
        </div>

        <div class="main-container img"></div>
      </article>
    </main>

    </div> -->
  </body>
</html>
